<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coming Soon</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Inter, Arial, sans-serif;
        background: #0a0a0a;
        color: #ffffff;
        min-height: 100vh;
        overflow: hidden;
      }

      .background {
        position: fixed;
        inset: 0;
        background:
          radial-gradient(circle at top right, rgba(168, 85, 247, 0.2), transparent 30%),
          radial-gradient(circle at bottom left, rgba(59, 130, 246, 0.18), transparent 35%),
          #0a0a0a;
        z-index: 0;
      }

      .wrapper {
        position: relative;
        z-index: 1;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .card {
        width: 100%;
        max-width: 1120px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(20px);
        border-radius: 32px;
        box-shadow: 0 25px 80px rgba(0, 0, 0, 0.4);
        overflow: hidden;
      }

      .grid {
        display: grid;
        grid-template-columns: 1.1fr 0.9fr;
      }

      .left,
      .right {
        padding: 56px;
      }

      .left {
        border-right: 1px solid rgba(255, 255, 255, 0.1);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        padding: 10px 16px;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        background: rgba(255, 255, 255, 0.08);
        font-size: 13px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.75);
      }

      h1 {
        margin: 28px 0 0;
        font-size: 64px;
        line-height: 1.05;
        letter-spacing: -0.04em;
      }

      .gradient-text {
        display: block;
        background: linear-gradient(to right, #ffffff, rgba(255, 255, 255, 0.6));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .description {
        margin-top: 24px;
        max-width: 560px;
        font-size: 18px;
        line-height: 1.8;
        color: rgba(255, 255, 255, 0.7);
      }

      .features {
        margin-top: 40px;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
      }

      .feature,
      .countdown-item,
      .message,
      .panel {
        border: 1px solid rgba(255, 255, 255, 0.1);
        background: rgba(255, 255, 255, 0.05);
        border-radius: 24px;
      }

      .feature {
        padding: 18px;
      }

      .feature strong {
        display: block;
        font-size: 28px;
      }

      .feature span {
        display: block;
        margin-top: 10px;
        font-size: 14px;
        color: rgba(255, 255, 255, 0.6);
      }

      .panel {
        background: rgba(0, 0, 0, 0.3);
        padding: 32px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
      }

      .eyebrow {
        font-size: 12px;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.45);
      }

      .countdown {
        margin-top: 28px;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
        text-align: center;
      }

      .countdown-item {
        padding: 18px 12px;
      }

      .countdown-value {
        font-size: 34px;
        font-weight: 700;
      }

      .countdown-label {
        margin-top: 6px;
        font-size: 11px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.45);
      }

      form {
        margin-top: 28px;
      }

      label {
        display: block;
        margin-bottom: 10px;
        font-size: 14px;
        color: rgba(255, 255, 255, 0.6);
      }

      input {
        width: 100%;
        padding: 16px 18px;
        border-radius: 18px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        background: rgba(255, 255, 255, 0.05);
        color: #ffffff;
        font-size: 15px;
        outline: none;
        transition: border-color 0.2s ease;
      }

      input::placeholder {
        color: rgba(255, 255, 255, 0.35);
      }

      input:focus {
        border-color: rgba(255, 255, 255, 0.3);
      }

      button {
        width: 100%;
        margin-top: 14px;
        padding: 16px 18px;
        border: 0;
        border-radius: 18px;
        background: #ffffff;
        color: #000000;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.2s ease, opacity 0.2s ease;
      }

      button:hover {
        transform: scale(1.01);
      }

      button:disabled {
        opacity: 0.7;
        cursor: not-allowed;
      }

      .message {
        margin-top: 16px;
        padding: 14px 16px;
        font-size: 14px;
        color: rgba(255, 255, 255, 0.85);
      }

      .message.error {
        color: rgba(255, 255, 255, 0.72);
      }

      @media (max-width: 960px) {
        body {
          overflow: auto;
        }

        .grid {
          grid-template-columns: 1fr;
        }

        .left {
          border-right: 0;
          border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .left,
        .right {
          padding: 32px;
        }

        h1 {
          font-size: 46px;
        }
      }

      @media (max-width: 640px) {
        .features,
        .countdown {
          grid-template-columns: repeat(2, 1fr);
        }

        h1 {
          font-size: 38px;
        }

        .description {
          font-size: 16px;
        }
      }
    </style>
  </head>
  <body>
    <div class="background"></div>

    <div class="wrapper">
      <div class="card">
        <div class="grid">
          <section class="left">
            <div>
              <div class="badge">Coming Soon</div>

              <h1>
                Something beautiful
                <span class="gradient-text">is on the way.</span>
              </h1>

              <p class="description">
                We’re building something fresh, elegant, and seriously exciting behind the scenes.
                Stay tuned — launch is closer than you think.
              </p>
            </div>

            <div class="features">
              <div class="feature">
                <strong>01</strong>
                <span>Clean design</span>
              </div>
              <div class="feature">
                <strong>02</strong>
                <span>Fast experience</span>
              </div>
              <div class="feature">
                <strong>03</strong>
                <span>Launching soon</span>
              </div>
            </div>
          </section>

          <section class="right">
            <div class="panel">
              <div class="eyebrow">Stay in the loop</div>

              <div class="countdown">
                <div class="countdown-item">
                  <div class="countdown-value" id="days">00</div>
                  <div class="countdown-label">Days</div>
                </div>
                <div class="countdown-item">
                  <div class="countdown-value" id="hours">00</div>
                  <div class="countdown-label">Hours</div>
                </div>
                <div class="countdown-item">
                  <div class="countdown-value" id="minutes">00</div>
                  <div class="countdown-label">Min</div>
                </div>
                <div class="countdown-item">
                  <div class="countdown-value" id="seconds">00</div>
                  <div class="countdown-label">Sec</div>
                </div>
              </div>

              <form id="notify-form">
                <label for="email">Get notified when we launch</label>
                <input
                  id="email"
                  name="email"
                  type="email"
                  placeholder="Enter your email"
                  required
                />
                <button type="submit" id="submit-button">Notify Me</button>
              </form>

              <div id="form-message" class="message" style="display: none;"></div>
            </div>
          </section>
        </div>
      </div>
    </div>

    <script>
      const launchDate = new Date();
      launchDate.setDate(launchDate.getDate() + 12);
      launchDate.setHours(18, 0, 0, 0);

      const daysEl = document.getElementById('days');
      const hoursEl = document.getElementById('hours');
      const minutesEl = document.getElementById('minutes');
      const secondsEl = document.getElementById('seconds');

      function updateCountdown() {
        const now = new Date().getTime();
        const distance = launchDate.getTime() - now;

        if (distance <= 0) {
          daysEl.textContent = '00';
          hoursEl.textContent = '00';
          minutesEl.textContent = '00';
          secondsEl.textContent = '00';
          return;
        }

        const days = Math.floor(distance / (1000 * 60 * 60 * 24));
        const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((distance % (1000 * 60)) / 1000);

        daysEl.textContent = String(days).padStart(2, '0');
        hoursEl.textContent = String(hours).padStart(2, '0');
        minutesEl.textContent = String(minutes).padStart(2, '0');
        secondsEl.textContent = String(seconds).padStart(2, '0');
      }

      updateCountdown();
      setInterval(updateCountdown, 1000);

      const form = document.getElementById('notify-form');
      const emailInput = document.getElementById('email');
      const submitButton = document.getElementById('submit-button');
      const formMessage = document.getElementById('form-message');

      form.addEventListener('submit', async function (event) {
        event.preventDefault();

        submitButton.disabled = true;
        submitButton.textContent = 'Submitting...';
        formMessage.style.display = 'none';
        formMessage.className = 'message';

        try {
          const response = await fetch('https://formspree.io/f/xgongank', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Accept': 'application/json'
            },
            body: JSON.stringify({ email: emailInput.value })
          });

          const data = await response.json();

          if (response.ok) {
            formMessage.textContent = 'Thanks! You’re on the list.';
            formMessage.style.display = 'block';
            emailInput.value = '';
          } else {
            formMessage.textContent = (data.errors && data.errors[0] && data.errors[0].message)
              ? data.errors[0].message
              : 'Something went wrong. Please try again.';
            formMessage.className = 'message error';
            formMessage.style.display = 'block';
          }
        } catch (error) {
          formMessage.textContent = 'Network error. Please try again.';
          formMessage.className = 'message error';
          formMessage.style.display = 'block';
        } finally {
          submitButton.disabled = false;
          submitButton.textContent = 'Notify Me';
        }
      });
    </script>
  </body>
</html>
