<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coming Soon</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: #0a0a0a;
      color: #fff;
    }

    body {
      overflow-x: hidden;
    }

    .bg {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at top right, rgba(168, 85, 247, 0.20), transparent 30%),
        radial-gradient(circle at bottom left, rgba(59, 130, 246, 0.18), transparent 35%),
        #0a0a0a;
      z-index: 0;
    }

    .page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 1120px;
      border: 1px solid rgba(255,255,255,0.10);
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 24px 80px rgba(0,0,0,0.40);
    }

    .grid {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
    }

    .left, .right {
      padding: 56px;
    }

    .left {
      border-right: 1px solid rgba(255,255,255,0.10);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 40px;
    }

    .badge {
      display: inline-block;
      padding: 10px 16px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.08);
      color: rgba(255,255,255,0.78);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.22em;
    }

    h1 {
      margin: 28px 0 0;
      font-size: 64px;
      line-height: 1.04;
      letter-spacing: -0.04em;
    }

    .subtle {
      display: block;
      color: rgba(255,255,255,0.62);
    }

    .description {
      margin-top: 24px;
      max-width: 560px;
      font-size: 18px;
      line-height: 1.8;
      color: rgba(255,255,255,0.72);
    }

    .features {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    .feature,
    .panel,
    .countdown-item,
    .message {
      border: 1px solid rgba(255,255,255,0.10);
      background: rgba(255,255,255,0.05);
      border-radius: 22px;
    }

    .feature {
      padding: 18px;
    }

    .feature-number {
      font-size: 28px;
      font-weight: bold;
    }

    .feature-label {
      margin-top: 10px;
      font-size: 14px;
      color: rgba(255,255,255,0.62);
    }

    .panel {
      background: rgba(0,0,0,0.28);
      padding: 32px;
    }

    .eyebrow {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.30em;
      color: rgba(255,255,255,0.45);
    }

    .countdown {
      margin-top: 28px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    .countdown-item {
      text-align: center;
      padding: 18px 12px;
    }

    .count-value {
      font-size: 34px;
      font-weight: 700;
    }

    .count-label {
      margin-top: 6px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: rgba(255,255,255,0.45);
    }

    form {
      margin-top: 28px;
    }

    .label {
      display: block;
      margin-bottom: 10px;
      font-size: 14px;
      color: rgba(255,255,255,0.62);
    }

    .input {
      width: 100%;
      border: 1px solid rgba(255,255,255,0.10);
      background: rgba(255,255,255,0.05);
      color: #fff;
      border-radius: 18px;
      padding: 16px 18px;
      font-size: 15px;
      outline: none;
    }

    .input::placeholder {
      color: rgba(255,255,255,0.35);
    }

    .input:focus {
      border-color: rgba(255,255,255,0.28);
    }

    .button {
      width: 100%;
      margin-top: 14px;
      border: 0;
      border-radius: 18px;
      padding: 16px 18px;
      font-size: 15px;
      font-weight: bold;
      background: #fff;
      color: #000;
      cursor: pointer;
    }

    .button:hover {
      opacity: 0.95;
    }

    .button:disabled {
      cursor: not-allowed;
      opacity: 0.7;
    }

    .message {
      display: none;
      margin-top: 16px;
      padding: 14px 16px;
      font-size: 14px;
      color: #fff;
    }

    .message.error {
      color: rgba(255,255,255,0.80);
    }

    @media (max-width: 960px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .left {
        border-right: 0;
        border-bottom: 1px solid rgba(255,255,255,0.10);
      }

      .left, .right {
        padding: 32px;
      }

      h1 {
        font-size: 46px;
      }
    }

    @media (max-width: 640px) {
      .features,
      .countdown {
        grid-template-columns: repeat(2, 1fr);
      }

      h1 {
        font-size: 38px;
      }

      .description {
        font-size: 16px;
      }
    }
  </style>
</head>
<body>
  <div class="bg"></div>

  <main class="page">
    <div class="card">
      <div class="grid">
        <section class="left">
          <div>
            <div class="badge">Coming Soon</div>
            <h1>
              Something beautiful
              <span class="subtle">is on the way.</span>
            </h1>
            <p class="description">
              We’re building something fresh, elegant, and seriously exciting behind the scenes.
              Stay tuned — launch is closer than you think.
            </p>
          </div>

          <div class="features">
            <div class="feature">
              <div class="feature-number">01</div>
              <div class="feature-label">Clean design</div>
            </div>
            <div class="feature">
              <div class="feature-number">02</div>
              <div class="feature-label">Fast experience</div>
            </div>
            <div class="feature">
              <div class="feature-number">03</div>
              <div class="feature-label">Launching soon</div>
            </div>
          </div>
        </section>

        <section class="right">
          <div class="panel">
            <div class="eyebrow">Stay in the loop</div>

            <div class="countdown">
              <div class="countdown-item">
                <div class="count-value" id="days">00</div>
                <div class="count-label">Days</div>
              </div>
              <div class="countdown-item">
                <div class="count-value" id="hours">00</div>
                <div class="count-label">Hours</div>
              </div>
              <div class="countdown-item">
                <div class="count-value" id="minutes">00</div>
                <div class="count-label">Minutes</div>
              </div>
              <div class="countdown-item">
                <div class="count-value" id="seconds">00</div>
                <div class="count-label">Seconds</div>
              </div>
            </div>

            <form id="notify-form" action="https://formspree.io/f/xgongank" method="POST">
              <label class="label" for="email">Get notified when we launch</label>
              <input class="input" id="email" name="email" type="email" placeholder="Enter your email" required />
              <button class="button" id="submit-button" type="submit">Notify Me</button>
            </form>

            <div class="message" id="form-message"></div>
          </div>
        </section>
      </div>
    </div>
  </main>

  <script>
    (function () {
      var TARGET_KEY = 'coming-soon-target-date';
      var savedTarget = localStorage.getItem(TARGET_KEY);

      var targetDate;

      if (savedTarget) {
        targetDate = new Date(savedTarget);
      } else {
        targetDate = new Date(Date.now() + 12 * 24 * 60 * 60 * 1000);
        localStorage.setItem(TARGET_KEY, targetDate.toISOString());
      }
      var STORAGE_KEY = 'coming-soon-email-submitted';

      var daysEl = document.getElementById('days');
      var hoursEl = document.getElementById('hours');
      var minutesEl = document.getElementById('minutes');
      var secondsEl = document.getElementById('seconds');
      var form = document.getElementById('notify-form');
      var emailInput = document.getElementById('email');
      var submitButton = document.getElementById('submit-button');
      var formMessage = document.getElementById('form-message');

      function pad(value) {
        return String(value).padStart(2, '0');
      }

      function updateCountdown() {
        var now = new Date().getTime();
        var distance = targetDate.getTime() - now;

        if (distance < 0) {
          daysEl.textContent = '00';
          hoursEl.textContent = '00';
          minutesEl.textContent = '00';
          secondsEl.textContent = '00';
          return;
        }

        var days = Math.floor(distance / (1000 * 60 * 60 * 24));
        var hours = Math.floor((distance / (1000 * 60 * 60)) % 24);
        var minutes = Math.floor((distance / (1000 * 60)) % 60);
        var seconds = Math.floor((distance / 1000) % 60);

        daysEl.textContent = pad(days);
        hoursEl.textContent = pad(hours);
        minutesEl.textContent = pad(minutes);
        secondsEl.textContent = pad(seconds);
      }

      function lockForm(message) {
        emailInput.disabled = true;
        submitButton.disabled = true;
        submitButton.textContent = 'Already Registered';
        formMessage.textContent = message;
        formMessage.className = 'message';
        formMessage.style.display = 'block';
      }

      updateCountdown();
      setInterval(updateCountdown, 1000);

      if (localStorage.getItem(STORAGE_KEY) === 'true') {
        lockForm('This browser has already submitted an email address.');
        return;
      }

      form.addEventListener('submit', function (event) {
        event.preventDefault();

        if (localStorage.getItem(STORAGE_KEY) === 'true') {
          lockForm('This browser has already submitted an email address.');
          return;
        }

        submitButton.disabled = true;
        submitButton.textContent = 'Submitting...';
        formMessage.style.display = 'none';
        formMessage.className = 'message';

        fetch('https://formspree.io/f/xgongank', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Accept': 'application/json'
          },
          body: JSON.stringify({ email: emailInput.value })
        })
          .then(function (response) {
            return response.json().then(function (data) {
              return { ok: response.ok, data: data };
            }).catch(function () {
              return { ok: response.ok, data: {} };
            });
          })
          .then(function (result) {
            if (result.ok) {
              localStorage.setItem(STORAGE_KEY, 'true');
              formMessage.textContent = 'Thanks! You are on the list. This browser cannot submit again.';
              formMessage.style.display = 'block';
              emailInput.value = '';
              lockForm('Thanks! You are on the list. This browser cannot submit again.');
            } else {
              formMessage.textContent = (result.data && result.data.errors && result.data.errors[0] && result.data.errors[0].message)
                ? result.data.errors[0].message
                : 'Something went wrong. Please try again.';
              formMessage.className = 'message error';
              formMessage.style.display = 'block';
              submitButton.disabled = false;
              submitButton.textContent = 'Notify Me';
            }
          })
          .catch(function () {
            formMessage.textContent = 'Network error. Please try again.';
            formMessage.className = 'message error';
            formMessage.style.display = 'block';
            submitButton.disabled = false;
            submitButton.textContent = 'Notify Me';
          });
      });
    })();
  </script>
</body>
</html>
